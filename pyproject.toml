[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "froghacker-ant-swarm"
version = "0.1.0"
description = "蛙客去中心化蚁群协作核心开源版 — 信息素调度 / CAS 抢占 / Worker P2P"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "FrogHacker (wwyhji)" }]
keywords = ["ant-colony", "multi-agent", "task-scheduling", "pheromone", "distributed"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []  # 纯标准库，零第三方依赖

[project.urls]
Homepage = "https://github.com/wwyhji/froghacker-ant-swarm"

[tool.setuptools.packages.find]
include = ["ant_swarm*"]
